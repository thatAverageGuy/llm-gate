[project]
name = "llmgate"
version = "0.8.2"
description = "Lightweight, provider-agnostic LLM calling library — OpenAI, Gemini, Anthropic, Groq, Mistral, Cohere, Azure, Bedrock, Ollama"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["llm", "openai", "gemini", "anthropic", "groq", "mistral", "cohere", "azure", "bedrock", "ollama", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai==2.29.0",
  "google-genai==1.74.0",
  "anthropic==0.86.0",
  "groq==1.1.1",
  "pydantic==2.12.5",
  "httpx==0.28.1",
  "typing_extensions==4.15.0",
]

[project.optional-dependencies]
mistral = ["mistralai==2.1.3"]
cohere  = ["cohere==5.20.7"]
bedrock = ["boto3==1.42.74"]
ollama  = ["ollama==0.6.1"]
# azure uses existing openai dep — no extra install needed
azure   = []
all     = ["mistralai==2.1.3", "cohere==5.20.7", "boto3==1.42.74", "ollama==0.6.1"]
dev     = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "respx==0.22.0", "twine==6.2.0"]

[project.urls]
Homepage = "https://github.com/thatAverageGuy/llm-gate"
Documentation = "https://thatAverageGuy.github.io/llm-gate"
Repository = "https://github.com/thatAverageGuy/llm-gate"
"Bug Tracker" = "https://github.com/thatAverageGuy/llm-gate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "mkdocs-material==9.7.6",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "respx==0.22.0",
  "ruff==0.15.7",
  "twine==6.2.0",
]
